<!DOCTYPE html>
<html lang="en">
<head>
          <meta charset="utf-8">
          <title>MoonlightBay Player DAB</title>
          <meta name="description" content="Dengarkan Radio Digital dengan gratis dan praktis.">
          <meta name="author" content="MoonlightBay Plus">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no,">
          <meta name="keywords" content="moonlightbay player, fm radio, am radio, sw radio, radio, radio streaming, radio player, streaming radio indonesia, radio online indonesia, prambors, genfm, iswara, mustangfm, mostradio, elshinta, sonora fm, jakarta, bandung, semarang, jogja, surabaya, bali" />
          <link rel="icon" type="image/png" href="/radio/favicon.png">
          <link rel="apple-touch-icon" href="/assets/img/Radio%20Icon.png">                
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="default">
          <meta name="apple-mobile-web-app-title" content="Radio">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
          <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
          <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
      <!-- Interface -->
    <style>
    body {
            background-color: #121212;
            color: #ffffff;
            font-family: "SF Pro Display";
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Header & Power Button */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-direction: row-reverse;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 400;
        }

    .radio-branding {
      position: absolute;
      top: 34px;
      left: 25px;
      margin: 14px;
      font-size: 35px;
      font-weight: 800;
    }
        .header h1 strong { font-weight: 700; }
        
        .power-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .power-btn {
            background: transparent;
            border: 2px solid #555;
            color: #555;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .power-btn.on {
            color: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }
        .status-text {
            color: #555;
            font-weight: bold;
            transition: 0.3s;
        }
        .status-text.on { color: #00ff88; }

        /* Main Display (Artwork & Info) */
        .main-display {
            display: flex;
            gap: 40px;
            align-items: center;
            flex: 1;
        }
        .artwork-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            background-color: #1e1e1e;
            border-radius: 20px;
            border: 3px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .artwork-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 17px;
        }
        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        .fav-btn:hover { transform: scale(1.1); }
        .fav-btn.active {
            color: #ff3b30;
            border-color: #ff3b30;
        }

        .station-info {
            flex: 1;
            opacity: 0.3; /* Redup saat mati */
            transition: opacity 0.5s;
        }
        .station-info.active { opacity: 1; } /* Terang saat nyala */
        
        .station-title { font-size: 3.5rem; margin: 0 0 5px 0; font-weight: bold; }
        .station-freq { font-size: 1.5rem; color: #888; margin: 0 0 30px 0; }
        .song-title { font-size: 2rem; margin: 0 0 5px 0; }
        .song-artist { font-size: 1.5rem; color: #aaa; margin: 0; }

        /* Slider Bawah */
        .slider-section {
            margin-top: auto;
        }
        .slider-instruction {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .slider-container {
            display: flex;
            gap: 20px;
            border-radius: 13px;
            overflow-x: auto;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }
        /* Custom Scrollbar untuk Slider */
        .slider-container::-webkit-scrollbar { height: 8px; }
        .slider-container::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 10px; }
        .slider-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .slider-container::-webkit-scrollbar-thumb:hover { background: #666; }

        .slider-item {
            width: 140px;
            height: 140px;
            border-radius: 15px;
            border: 2px solid #333;
            background: #1e1e1e;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .slider-item:hover { border-color: #888; transform: translateY(-5px); }
        .slider-item.playing { border-color: #00ff88; }
        .slider-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 13px; }
        
        .slider-item .fav-btn {
            width: 30px; height: 30px; font-size: 16px; top: 8px; right: 8px; border-width: 1px;
        }
/* --- TAMPILAN MOBILE / PORTRAIT MODE --- */
        @media (max-width: 768px) {
            body {
                padding: 20px 0px; /* Mengurangi jarak di pinggir layar */
            }
    
        .radio-branding {
            position: absolute;
            top: 0px;
            left: 5px;
            margin: 14px;
        }
                  
        .header {
            margin-right: 20px;
        }

            /* Mengubah arah layout menjadi atas-bawah (Vertikal) */
            .main-display {
                flex-direction: column;
                gap: 15px; 
                text-align: center; /* Membuat teks rata tengah */
            }

            /* Memperkecil Artwork sekitar 5% (Dari 320px menjadi 300px) */
            .artwork-wrapper {
                width: 300px;
                height: 300px;
            }

            /* Menyesuaikan ukuran teks agar pas dan rapi di layar HP */
            .station-title { font-size: 2.2rem; }
            .station-freq { font-size: 1.2rem; margin-bottom: 10px; }
            .song-title { font-size: 1.5rem; }
            .song-artist { font-size: 1.2rem; }

            /* Menyesuaikan Slider Bawah (Menghapus Padding) */
            .slider-section {
                margin-top: 20px;
            }
            .slider-container {
                gap: 12px; /* Merapatkan sedikit jarak antar kotak radio */
            }
            
            /* Sedikit memperkecil kotak radio di slider bawah agar lebih pas di HP */
            .slider-item {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>
<body class="prevent-select" ontouchstart="">
      <!-- Player -->
  <div class="radio-branding">Radio</div>
    <!-- Bagian Atas / Header -->
    <div class="header">
        <div class="power-container">
            <span class="status-text" id="statusText">OFF</span>
            <button class="power-btn" id="powerBtn" onclick="togglePower()"><i class="fas fa-power-off"></i></button>
        </div>
    </div>

    <!-- Tampilan Utama (Artwork 1:1 dan Info) -->
    <div class="main-display">
        <div class="artwork-wrapper">
            <!-- Gambar Placeholder (Ganti dengan URL Logo Artwork) -->
            <img id="mainArtwork" src="https://via.placeholder.com/400x400/222222/ffffff?text=RRI+PRO2" alt="Artwork Radio">
            <button class="fav-btn" id="mainFavBtn" onclick="toggleFavoriteCurrent()">♡</button>
        </div>
        <div class="station-info" id="stationInfo">
            <h2 class="station-title" id="mainStationName">Station Name</h2>
            <p class="station-freq" id="mainFreq"></p>
            <h3 class="song-title" id="mainSong">Song Title</h3>
            <p class="song-artist" id="mainArtist">Artist</p>
        </div>
    </div>

    <!-- Slider Navigasi Bawah -->
    <div class="slider-section">
        <div class="slider-instruction">GESER UNTUK CARI & KLIK UNTUK GANTI STASIUN</div>
        <div class="slider-container" id="stationSlider">
            <!-- Item Slider akan digenerate melalui JavaScript -->
        </div>
    </div>
          
    <div id="navbar-placeholder"></div>
    <!-- Audio Element (Hidden) -->
    <audio id="radioAudio"></audio>

    <script>
        // Database Stasiun Radio Simulasi
        const stations = [
            { id: "delta_fm", name: "DELTA FM", freq: "13C", img: "https://images.noiceid.cc/catalog/300x300/content-1692789803987", stream: "https://s1.cloudmu.id/listen/delta_fm/stream" },
            { id: "elshinta_jkt", name: "ELSHINTA", freq: "11A", img: "https://i1.sndcdn.com/avatars-000562957632-ke3bru-t240x240.jpg", stream: "https://stream-ssl.arenastreaming.com:8000/jakarta" },
            { id: "female_jkt", name: "FEMALE", freq: "13C", img: "https://images.noiceid.cc/catalog/300x300/content-1692789974803", stream: "https://stream.rcs.revma.com/9thenqqd2ncwv" },
            { id: "gen_fm", name: "GEN FM", freq: "13C", img: "https://images.noiceid.cc/catalog/300x300/content-1614529848190.jpg", stream: "https://ic.mari.co.id:8443/genfm" },
            { id: "hot_fm", name: "HOT FM", freq: "13C", img: "https://images.noiceid.cc/catalog/300x300/content-1614529815902.jpg", stream: "https://ic.mari.co.id:8443/hotfm" },
            { id: "trax_fm", name: "ISWARA", freq: "11A", img: "https://static.mytuner.mobi/media/radios-150px/938/iswara-jakarta.3c482bf1.jpg", stream: "https://n0a.radiojar.com/4ywdgup3bnzuv" },
            { id: "jak_fm", name: "JAK FM", freq: "13C", img: "https://images.noiceid.cc/catalog/300x300/content-1614529857498.jpg", stream: "https://ic.mari.co.id:8443/jakfm" },
            { id: "kis_fm", name: "KIS FM", freq: "13C", img: "https://images-v2.noiceid.cc/catalog/300x300/content-1763355760999.webp", stream: "https://ic.mari.co.id:8443/kisfm" },
            { id: "most_fm", name: "MOST FM", freq: "13C", img: "https://images-v2.noiceid.cc/catalog/300x300/content-1725008389287.webp", stream: "https://ic.mari.co.id:8443/mostfm" },
            { id: "mustang_fm", name: "MUSTANG FM", freq: "13C", img: "https://images.noiceid.cc/catalog/300x300/content-1614529793044.jpg", stream: "https://ic.mari.co.id:8443/mustangfm" },
            { id: "prambors_jkt", name: "PRAMBORS", freq: "13C", img: "https://images-v2.noiceid.cc/catalog/300x300/content-1720586939252.webp", stream: "https://stream.rcs.revma.com/h77wwp48kxcwv" },
            { id: "rri_pro1_jkt", name: "RRI PRO1 JAKARTA", freq: "12D", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAIfMi1GnW8NdLHj9QY3yG94rM2DZwGjzBBQtRlHgOIQ&s", stream: "https://stream-node1.rri.co.id/streaming/25/9025/rrijakartapro1.mp3" },
            { id: "rri_pro2_jkt", name: "RRI PRO2 JAKARTA", freq: "12D", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_gRcwXDFa2ellcXe9MtAGlG7IezOZMmnSI3btpKBjPw&s", stream: "https://stream-node1.rri.co.id/streaming/25/9025/rrijakartapro2.mp3" },
            { id: "rri_pro3_jkt", name: "RRI PRO3", freq: "12D", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSj4reyXHlVHjCBUVhaFWfFdGCsA-n3Wf_a2dvdzBL9vg&s", stream: "https://stream-node0.rri.co.id/streaming/14/9014/kbrn.mp3" },
            { id: "rri_pro4_jkt", name: "RRI PRO4 JAKARTA", freq: "12D", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSl-K07047H74RbmpwbMniAn9VFwm23eNgDaaGy7EltLQ&s", stream: "http://stream-node1.rri.co.id/streaming/25/9025/rrijakartapro4.mp3" },
            { id: "rri_pro5", name: "RRI PRO5", freq: "12D", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLd1PGulN-2nYbYhWqsuYAlKM_PiI_TDO6InkSYEpTdw&s=10", stream: "https://stream-node1.rri.co.id/streaming/41/8941/chlima.mp3" },
            { id: "rri_jazz", name: "RRI JAZZ CHANNEL", freq: "12D", img: "https://cdn.onlineradiobox.com/img/l/3/151903.v1.png", stream: "https://stream-node2.rri.co.id/streaming/40/9340/jazz.mp3" },
            { id: "rri_classic", name: "RRI KANAL KENANGAN", freq: "12D", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_Y1QqELq9-UMp7pbFSOROtb3HMP1n7bWnEksDn3wLrg&s=10", stream: "https://stream-node2.rri.co.id/streaming/40/9340/memori.mp3" },
            { id: "hardrock_fm", name: "THE ROCKIN LIFE", freq: "11A", img: "https://images-v2.noiceid.cc/catalog/300x300/content-1740736595278.webp", stream: "https://stream.radiojar.com/7csmg90fuqruv" },
            { id: "voi", name: "VOICE OF INDONESIA", freq: "12D", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbinbbizQppA2C2O9EGa5vmzcFRutKib_4IzX-UfyktA&s=10", stream: "https://stream-node0.rri.co.id/streaming/25/9125/voi.mp3" },
        ];

        let isPowerOn = false;
        let currentStationIndex = 0;
        let favorites = [];

        // --- SISTEM COOKIES ---
        function loadFavorites() {
            const savedFavs = localStorage.getItem('moonlightDabFavs');
            if (savedFavs) {
                favorites = JSON.parse(savedFavs);
            }
        }

        function saveFavorites() {
            localStorage.setItem('moonlightDabFavs', JSON.stringify(favorites));
        }

        function toggleFavorite(stationId, event) {
            if (event) event.stopPropagation(); // Mencegah terklik ganti stasiun saat klik tombol love

            const index = favorites.indexOf(stationId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(stationId);
            }
            saveFavorites();
            updateUI();
        }

        function toggleFavoriteCurrent() {
            toggleFavorite(stations[currentStationIndex].id, null);
        }

        // --- SISTEM POWER & PLAYER ---
        function togglePower() {
            isPowerOn = !isPowerOn;
            const pwrBtn = document.getElementById('powerBtn');
            const statusTxt = document.getElementById('statusText');
            const infoPnl = document.getElementById('stationInfo');
            const audio = document.getElementById('radioAudio');

            if (isPowerOn) {
                pwrBtn.classList.add('on');
                statusTxt.classList.add('on');
                statusTxt.innerText = "ON";
                infoPnl.classList.add('active');
                
                // PERBAIKAN 1: Tanda // sudah dihapus agar audio menyala
                if (stations[currentStationIndex].stream !== "") {
                    audio.src = stations[currentStationIndex].stream;
                    audio.play().catch(error => console.log("Gagal memutar audio:", error));
                }
                
            } else {
                pwrBtn.classList.remove('on');
                statusTxt.classList.remove('on');
                statusTxt.innerText = "OFF";
                infoPnl.classList.remove('active');
                
                // PERBAIKAN 2: Tanda // sudah dihapus agar audio mati saat tombol OFF ditekan
                audio.pause();
                audio.src = "";
            }
        }

        function changeStation(index) {
            currentStationIndex = index;
            updateUI();
            
            const audio = document.getElementById('radioAudio');
            
            // PERBAIKAN 3: Tanda // sudah dihapus agar audio langsung ganti saat artwork di-klik
            if (isPowerOn) {
                audio.pause();
                if (stations[currentStationIndex].stream !== "") {
                    audio.src = stations[currentStationIndex].stream;
                    audio.play().catch(error => console.log("Gagal memutar audio:", error));
                } else {
                    audio.src = "";
                }
            }
        }

        // --- RENDER ANTARMUKA ---
        function updateUI() {
            const currentStation = stations[currentStationIndex];

            // Update Main Display
            document.getElementById('mainArtwork').src = currentStation.img;
            document.getElementById('mainStationName').innerText = currentStation.name;
            document.getElementById('mainFreq').innerText = currentStation.freq;
            document.getElementById('mainSong').innerText = currentStation.song;
            document.getElementById('mainArtist').innerText = currentStation.artist;

            // Update Status Tombol Love Utama
            const mainFavBtn = document.getElementById('mainFavBtn');
            if (favorites.includes(currentStation.id)) {
                mainFavBtn.classList.add('active');
                mainFavBtn.innerText = "♥"; // Solid Heart
            } else {
                mainFavBtn.classList.remove('active');
                mainFavBtn.innerText = "♡"; // Outline Heart
            }

            // Render Slider Ulang
            renderSlider();
        }

        function renderSlider() {
            const sliderContainer = document.getElementById('stationSlider');
            sliderContainer.innerHTML = ''; // Bersihkan isi lama

            stations.forEach((station, index) => {
                const isFav = favorites.includes(station.id);
                const isPlaying = (index === currentStationIndex);

                const itemHTML = `
                    <div class="slider-item ${isPlaying ? 'playing' : ''}" onclick="changeStation(${index})">
                        <img src="${station.img}" alt="${station.name}">
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${station.id}', event)">
                            ${isFav ? '♥' : '♡'}
                        </button>
                    </div>
                `;
                sliderContainer.innerHTML += itemHTML;
            });
        }

        // Inisialisasi saat web dimuat
        window.onload = () => {
            loadFavorites();
            updateUI();

            // --- FITUR SCROLL MOUSE TANPA SHIFT ---
            const slider = document.getElementById('stationSlider');
            slider.addEventListener('wheel', (event) => {
                event.preventDefault(); // Mencegah layar ikut ter-scroll ke bawah
                slider.scrollLeft += (event.deltaY * 3); // Mengubah scroll vertikal jadi horizontal
            });
        };
    </script>
</body>
</html>
